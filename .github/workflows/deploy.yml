name: Deploy Power BI por entorno

on:
  push:
    branches:
      - ATS_CUMPLIMIENTO_RIESGOS_INT
      - ATS_CUMPLIMIENTO_RIESGOS_PRE
      - ATS_CUMPLIMIENTO_RIESGOS_PRO

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar parámetros de INT
        if: github.ref == 'refs/heads/ATS_CUMPLIMIENTO_RIESGOS_INT'
        run: |
          sed -i 's/expression Database = "[^"]*"/expression Database = "QTCCDWH.acciona.int,50005"/' \
          CdM_Riesgos/CdM_Riesgos.SemanticModel/definition/expressions.tmdl

      - name: Aplicar parámetros de PRE
        if: github.ref == 'refs/heads/ATS_CUMPLIMIENTO_RIESGOS_PRE'
        run: |
          sed -i 's/expression Database = "[^"]*"/expression Database = "QTCCDWH.acciona.int,50005"/' \
          CdM_Riesgos/CdM_Riesgos.SemanticModel/definition/expressions.tmdl

      - name: Aplicar parámetros de PRO
        if: github.ref == 'refs/heads/ATS_CUMPLIMIENTO_RIESGOS_PRO'
        run: |
          sed -i 's/expression Database = "[^"]*"/expression Database = "QECCDWH.acciona.int,60001"/' \
          CdM_Riesgos/CdM_Riesgos.SemanticModel/definition/expressions.tmdl

      - name: Commit parámetros de entorno
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add CdM_Riesgos/CdM_Riesgos.SemanticModel/definition/expressions.tmdl
          git diff --cached --quiet || git commit -m "ci: aplicar parámetros de entorno [skip ci]"
          git push
